name: Project Hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Reject unresolved merge markers
        run: |
          if grep -R -nE '^(<<<<<<< |>>>>>>> )' --exclude-dir=.git .; then
            echo "Unresolved Git merge markers found"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Web build
        run: pnpm run build:web

      - name: Static smoke test
        run: |
          python3 -m http.server 4173 --directory dist/public >/tmp/intelligence-dashboard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/home.html

      - name: Dependency audit
        run: pnpm audit --audit-level low
