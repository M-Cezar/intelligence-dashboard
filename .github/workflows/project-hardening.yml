name: Project Hardening

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Regenerate clean lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Persist clean lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already clean"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- pnpm-lock.yaml
            git commit -m "fix: regenerate clean pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Web build
        run: pnpm run build:web

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: clean-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
