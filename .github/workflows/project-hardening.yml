name: Project Hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Reject unresolved merge markers
        run: |
          if grep -R -nE '^(<<<<<<< |>>>>>>> )' --exclude-dir=.git .; then
            echo "Unresolved Git merge markers found"
            exit 1
          fi

      - name: Reject frontend secret-like environment variables
        run: |
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|TOKEN|PRIVATE_KEY)|VITE_FRONTEND_FORGE_API_KEY' -- ':!pnpm-lock.yaml'; then
            echo "Potential secret configured for frontend exposure"
            exit 1
          fi

      - name: Reject committed private keys
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----'; then
            echo "Private key material found in repository"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Web build
        run: pnpm run build:web

      - name: Reject server secret names in browser bundle
        run: |
          if grep -R -nE 'JWT_SECRET|DATABASE_URL|BUILT_IN_FORGE_API_KEY|OWNER_OPEN_ID' dist/public; then
            echo "Server secret reference leaked into browser bundle"
            exit 1
          fi

      - name: Static smoke test
        run: |
          python3 -m http.server 4173 --directory dist/public >/tmp/intelligence-dashboard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/home.html

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level moderate

      - name: Full dependency audit
        run: pnpm audit --audit-level moderate
