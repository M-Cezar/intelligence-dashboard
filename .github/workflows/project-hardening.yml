name: Project Hardening

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Normalize dashboard for local and native mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("client/src/pages/Home.tsx")
          text = path.read_text()
          text = text.replace(
              'let { user, loading, error, isAuthenticated, logout } = useAuth();',
              'const { user, isAuthenticated, isNative, logout } = useAuth();'
          )
          old = '''              {isAuthenticated ? (\n                <Button variant="outline" size="sm" onClick={logout}>\n                  Sair\n                </Button>\n              ) : (\n                <Button size="sm" onClick={() => window.location.href = '/api/oauth/login'}>\n                  Entrar\n                </Button>\n              )}'''
          new = '''              {!isNative && (isAuthenticated ? (\n                <Button variant="outline" size="sm" onClick={logout}>\n                  Sair\n                </Button>\n              ) : (\n                <Button size="sm" onClick={() => window.location.href = '/api/oauth/login'}>\n                  Entrar\n                </Button>\n              ))}'''
          text = text.replace(old, new)
          replacements = {
              'Atualizado hoje': 'Base local',
              'Concursos disponíveis': 'Concursos na base',
              'Notícias recentes': 'Notícias na base',
              'Ativos monitorados': 'Ativos na base',
              'Dados atualizados em tempo real': 'Base local para validação; confirme dados nas fontes oficiais',
              'Desenvolvido com ❤️ para ajudar você a tomar melhores decisões': 'Centralização de informações para consulta e análise',
              '<p className="text-xs text-gray-600">Area</p>': '<p className="text-xs text-gray-600">Área</p>',
              '                      Inscrever-se\n': '                      Ver detalhes\n',
              'data: "Hoje"': 'data: "Base local"',
              'data: "Ontem"': 'data: "Base local"',
              'data: "2 dias atrás"': 'data: "Base local"',
          }
          for old_text, new_text in replacements.items():
              text = text.replace(old_text, new_text)
          path.write_text(text)
          PY

      - name: Regenerate clean lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Persist normalized sources and clean lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- client/src/pages/Home.tsx pnpm-lock.yaml; then
            echo "Sources and lockfile already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- client/src/pages/Home.tsx pnpm-lock.yaml
            git commit -m "fix: normalize local mode and regenerate lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Web build
        run: pnpm run build:web

      - name: Static smoke test
        run: |
          python3 -m http.server 4173 --directory dist/public >/tmp/intelligence-dashboard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/home.html

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: clean-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
