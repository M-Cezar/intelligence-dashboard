name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Build web app
        run: pnpm run build:web

      - name: Reject secret references in web bundle
        run: |
          if grep -R -nE 'JWT_SECRET|DATABASE_URL|BUILT_IN_FORGE_API_KEY|OWNER_OPEN_ID|VITE_FRONTEND_FORGE_API_KE[Y]' dist/public; then
            echo "Sensitive configuration reference found in web bundle"
            exit 1
          fi

      - name: Create Android project
        run: pnpm exec cap add android

      - name: Harden Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")
          app.set(f"{{{android}}}allowBackup", "false")
          app.set(f"{{{android}}}usesCleartextTraffic", "false")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml

      - name: Sync Android
        run: pnpm exec cap sync android

      - name: Build testing-only debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-dashboard-testing-only-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
